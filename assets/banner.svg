<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="Murasaki Chat Agent">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#faf8ff"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.5" stop-color="#9333ea"/>
      <stop offset="1" stop-color="#d946ef"/>
    </linearGradient>
    <linearGradient id="brandV" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#d946ef"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d946ef" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#d946ef" stop-opacity="0"/>
    </radialGradient>
    <style>
      .sans { font-family: "Helvetica Neue", Arial, "Segoe UI", system-ui, sans-serif; }
      .mono { font-family: "SFMono-Regular", Menlo, Consolas, monospace; }
      .serif{ font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif; }
    </style>
  </defs>

  <rect width="1280" height="420" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1278" height="418" rx="23" fill="none" stroke="#ece6fb" stroke-width="2"/>

  <!-- brand lockup -->
  <text x="80" y="70" class="serif" font-size="30" fill="url(#brandV)">&#33544;</text>
  <text x="116" y="68" class="sans" font-size="17" font-weight="700" letter-spacing="3" fill="#7c3aed">MURASAKI</text>
  <text x="80" y="140" class="sans" font-size="72" font-weight="800" fill="#231a3d" letter-spacing="-1.5">Chat <tspan fill="url(#brand)">Agent</tspan></text>
  <text x="84" y="184" class="sans" font-size="23" font-weight="600" fill="#6d28d9">Connect any AI agent to the apps you already use.</text>
  <text x="84" y="218" class="sans" font-size="16.5" fill="#6f6790">Read. Act. Stay connected and reply, in real time. One sentence to set up.</text>

  <!-- channel chips -->
  <g class="sans" font-size="15" font-weight="600">
    <g transform="translate(84,282)"><rect width="92" height="36" rx="18" fill="#f5f1ff" stroke="#d9cdf7"/><text x="46" y="23" text-anchor="middle" fill="#4c1d95">Slack</text></g>
    <g transform="translate(186,282)"><rect width="120" height="36" rx="18" fill="#f5f1ff" stroke="#d9cdf7"/><text x="60" y="23" text-anchor="middle" fill="#4c1d95">WhatsApp</text></g>
    <g transform="translate(316,282)"><rect width="100" height="36" rx="18" fill="#f5f1ff" stroke="#d9cdf7"/><text x="50" y="23" text-anchor="middle" fill="#4c1d95">Discord</text></g>
    <g transform="translate(426,282)"><rect width="106" height="36" rx="18" fill="#f5f1ff" stroke="#d9cdf7"/><text x="53" y="23" text-anchor="middle" fill="#4c1d95">Telegram</text></g>
    <g transform="translate(542,282)"><rect width="98" height="36" rx="18" fill="#f5f1ff" stroke="#d9cdf7"/><text x="49" y="23" text-anchor="middle" fill="#4c1d95">iMessage</text></g>
    <g transform="translate(84,330)"><rect width="84" height="36" rx="18" fill="#f5f1ff" stroke="#d9cdf7"/><text x="42" y="23" text-anchor="middle" fill="#4c1d95">Linear</text></g>
    <g transform="translate(178,330)"><rect width="168" height="36" rx="18" fill="#faf5ff" stroke="#e7b6ee"/><text x="84" y="23" text-anchor="middle" fill="#a21caf">+ any app via MCP</text></g>
  </g>

  <!-- self-contained emblem (right column), clear of all text -->
  <g>
    <circle cx="1046" cy="214" r="140" fill="url(#halo)"/>
    <g>
      <line x1="902" y1="132" x2="1004" y2="200" stroke="url(#brandV)" stroke-width="2.2" opacity="0.7"/>
      <line x1="892" y1="214" x2="1004" y2="214" stroke="url(#brandV)" stroke-width="2.2" opacity="0.7"/>
      <line x1="902" y1="296" x2="1004" y2="228" stroke="url(#brandV)" stroke-width="2.2" opacity="0.7"/>
    </g>
    <g fill="#ffffff" stroke="url(#brandV)" stroke-width="2.4">
      <circle cx="896" cy="132" r="11"/>
      <circle cx="884" cy="214" r="11"/>
      <circle cx="896" cy="296" r="11"/>
    </g>
    <circle cx="1046" cy="214" r="56" fill="#ffffff" stroke="url(#brandV)" stroke-width="3"/>
    <text x="1046" y="228" text-anchor="middle" class="mono" font-size="40" font-weight="700" fill="#7c3aed">&#123;&#125;</text>
    <text x="1046" y="304" text-anchor="middle" class="sans" font-size="15" font-weight="600" fill="#6f6790">your agent</text>
  </g>
</svg>
