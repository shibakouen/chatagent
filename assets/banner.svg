<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="ChatAgent by Murasaki">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0618"/>
      <stop offset="1" stop-color="#1a0c33"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.5" stop-color="#9333ea"/>
      <stop offset="1" stop-color="#d946ef"/>
    </linearGradient>
    <radialGradient id="glowL" cx="18%" cy="-10%" r="70%">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="92%" cy="115%" r="75%">
      <stop offset="0" stop-color="#d946ef" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#d946ef" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <style>
      .sans { font-family: "Helvetica Neue", Arial, "Segoe UI", system-ui, sans-serif; }
      .mono { font-family: "SFMono-Regular", Menlo, Consolas, monospace; }
      .serif{ font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif; }
    </style>
  </defs>

  <rect width="1280" height="420" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="24" fill="url(#glowL)"/>
  <rect width="1280" height="420" rx="24" fill="url(#glowR)"/>

  <!-- connection motif: apps on the left wiring into one agent core on the right -->
  <g stroke="url(#brand)" stroke-width="2" fill="none" opacity="0.55">
    <path d="M250 150 C 470 150, 560 210, 980 210"/>
    <path d="M250 210 C 470 210, 560 210, 980 210"/>
    <path d="M250 270 C 470 270, 560 210, 980 210"/>
  </g>
  <g fill="#120a24" stroke="url(#brand)" stroke-width="2">
    <circle cx="250" cy="150" r="9"/>
    <circle cx="250" cy="210" r="9"/>
    <circle cx="250" cy="270" r="9"/>
  </g>

  <!-- agent core -->
  <circle cx="980" cy="210" r="58" fill="url(#brand)" opacity="0.18" filter="url(#soft)"/>
  <circle cx="980" cy="210" r="42" fill="#140a28" stroke="url(#brand)" stroke-width="2.5"/>
  <text x="980" y="222" text-anchor="middle" class="mono" font-size="30" font-weight="700" fill="#f5f3ff">&#123;&#125;</text>
  <text x="980" y="292" text-anchor="middle" class="sans" font-size="15" fill="#b9b0d6">your agent</text>

  <!-- wordmark -->
  <text x="80" y="118" class="sans" font-size="76" font-weight="800" fill="#f5f3ff" letter-spacing="-1.5">Chat<tspan fill="url(#brand)">Agent</tspan></text>
  <text x="84" y="162" class="sans" font-size="23" font-weight="500" fill="#c4b5fd">Connect any AI agent to the apps you already use.</text>
  <text x="84" y="196" class="sans" font-size="16" fill="#8f86b0">Read. Act. Stay connected and reply, in real time. One sentence to set up.</text>

  <!-- channel chips -->
  <g class="sans" font-size="15" font-weight="600">
    <g transform="translate(84,320)">
      <rect width="92" height="34" rx="17" fill="#ffffff" fill-opacity="0.05" stroke="#a78bfa" stroke-opacity="0.35"/>
      <text x="46" y="22" text-anchor="middle" fill="#ede9fe">Slack</text>
    </g>
    <g transform="translate(186,320)">
      <rect width="118" height="34" rx="17" fill="#ffffff" fill-opacity="0.05" stroke="#a78bfa" stroke-opacity="0.35"/>
      <text x="59" y="22" text-anchor="middle" fill="#ede9fe">WhatsApp</text>
    </g>
    <g transform="translate(314,320)">
      <rect width="98" height="34" rx="17" fill="#ffffff" fill-opacity="0.05" stroke="#a78bfa" stroke-opacity="0.35"/>
      <text x="49" y="22" text-anchor="middle" fill="#ede9fe">Discord</text>
    </g>
    <g transform="translate(422,320)">
      <rect width="104" height="34" rx="17" fill="#ffffff" fill-opacity="0.05" stroke="#a78bfa" stroke-opacity="0.35"/>
      <text x="52" y="22" text-anchor="middle" fill="#ede9fe">Telegram</text>
    </g>
    <g transform="translate(536,320)">
      <rect width="96" height="34" rx="17" fill="#ffffff" fill-opacity="0.05" stroke="#a78bfa" stroke-opacity="0.35"/>
      <text x="48" y="22" text-anchor="middle" fill="#ede9fe">iMessage</text>
    </g>
    <g transform="translate(642,320)">
      <rect width="82" height="34" rx="17" fill="#ffffff" fill-opacity="0.05" stroke="#a78bfa" stroke-opacity="0.35"/>
      <text x="41" y="22" text-anchor="middle" fill="#ede9fe">Linear</text>
    </g>
    <g transform="translate(734,320)">
      <rect width="150" height="34" rx="17" fill="#ffffff" fill-opacity="0.05" stroke="#a78bfa" stroke-opacity="0.35"/>
      <text x="75" y="22" text-anchor="middle" fill="#c4b5fd">+ any app via MCP</text>
    </g>
  </g>

  <!-- murasaki mark -->
  <g transform="translate(1155,44)">
    <text x="40" y="26" text-anchor="end" class="sans" font-size="13" fill="#8f86b0">by</text>
    <text x="78" y="30" text-anchor="end" class="serif" font-size="34" fill="url(#brand)">&#33544;</text>
    <text x="78" y="50" text-anchor="end" class="sans" font-size="12" letter-spacing="1" fill="#b9b0d6">MURASAKI</text>
  </g>
</svg>
