  <text x="512" y="540" text-anchor="middle" class="mono" font-size="290" font-weight="700" fill="#231a3d">&#123;&#125;</text>
  <text x="512" y="880" text-anchor="middle" class="serif" font-size="150" fill="url(#brand)">&#33544;</text>
